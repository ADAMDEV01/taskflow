name: CI
on:
  push:
    branches: [main, 'taskflow/**']
  pull_request:
    branches: [main]
permissions:
  contents: write

jobs:
  frontend:
    name: Frontend quality and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Resolve and commit the lockfile once so clean local npm ci installs are reproducible.
      - run: npm run lockfile:sync
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-package-lock
          path: package-lock.json
          retention-days: 7
      - name: Persist synchronized lockfile to the pull request branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          cp package-lock.json "$RUNNER_TEMP/package-lock.json"
          git fetch origin "$PR_BRANCH"
          git checkout -B "$PR_BRANCH" "origin/$PR_BRANCH"
          cp "$RUNNER_TEMP/package-lock.json" package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: synchronize npm lockfile"
            git push origin "$PR_BRANCH"
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --reporter=verbose
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  database-rls:
    name: Supabase PostgreSQL RLS integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - run: supabase db reset
      - run: supabase test db
